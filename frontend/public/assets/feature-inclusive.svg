<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
  <title id="title">Inclusive by design</title>
  <desc id="desc">An accessible website preview surrounded by tokens for alt text, contrast, keyboard access, and captions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa4ff"/>
      <stop offset="1" stop-color="#2463ea"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7c9"/>
      <stop offset="1" stop-color="#0ea47f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7a2ff"/>
      <stop offset="1" stop-color="#7048e8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#cadcf9" opacity=".7"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1b3f77" flood-opacity=".16"/>
    </filter>
    <filter id="chip" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1b3f77" flood-opacity=".14"/>
    </filter>
  </defs>
  <style>.t{font-family:'Segoe UI',Arial,sans-serif}</style>

  <rect x="0" y="0" width="440" height="260" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="440" height="260" rx="22" fill="url(#dots)" opacity=".7"/>
  <circle cx="410" cy="30" r="66" fill="#dcecff" opacity=".7"/>
  <circle cx="22" cy="238" r="52" fill="#e3eeff" opacity=".8"/>

  <g filter="url(#shadow)">
    <rect x="96" y="48" width="248" height="164" rx="16" fill="#fff"/>
  </g>
  <rect x="96" y="48" width="248" height="26" rx="16" fill="#f1f6ff"/>
  <rect x="96" y="58" width="248" height="16" fill="#f1f6ff"/>
  <path d="M96 74h248" stroke="#e5eefb"/>
  <circle cx="111" cy="61" r="3.2" fill="#ff8585"/>
  <circle cx="121" cy="61" r="3.2" fill="#ffcd5c"/>
  <circle cx="131" cy="61" r="3.2" fill="#45d2a5"/>
  <rect x="280" y="55" width="48" height="12" rx="6" fill="#e5effd"/>
  <text x="304" y="64" class="t" font-size="6.5" fill="#6382ad" text-anchor="middle">a11y ready</text>

  <text x="114" y="96" class="t" font-size="12.5" font-weight="700" fill="#0a1f44">Everyone included</text>
  <text x="114" y="110" class="t" font-size="8.5" fill="#778aa9">Built for every ability and device.</text>

  <g>
    <circle cx="126" cy="128" r="11" fill="#f3c9a7" stroke="#fff" stroke-width="2"/>
    <path d="M119 140c1.6-5.5 4-8 7-8s5.4 2.5 7 8" fill="#fff" opacity=".85"/>
    <circle cx="145" cy="128" r="11" fill="#c58f68" stroke="#fff" stroke-width="2"/>
    <path d="M138 140c1.6-5.5 4-8 7-8s5.4 2.5 7 8" fill="#fff" opacity=".85"/>
    <circle cx="164" cy="128" r="11" fill="#8fbfa8" stroke="#fff" stroke-width="2"/>
    <path d="M157 140c1.6-5.5 4-8 7-8s5.4 2.5 7 8" fill="#fff" opacity=".85"/>
    <circle cx="183" cy="128" r="11" fill="#b7a2e8" stroke="#fff" stroke-width="2"/>
    <path d="M176 140c1.6-5.5 4-8 7-8s5.4 2.5 7 8" fill="#fff" opacity=".85"/>
    <text x="201" y="132" class="t" font-size="8" fill="#5c7399">and you</text>
  </g>

  <rect x="114" y="148" width="212" height="50" rx="10" fill="#f8fbff" stroke="#e7eefb"/>
  <rect x="122" y="156" width="68" height="34" rx="7" fill="url(#blue)" opacity=".92"/>
  <circle cx="140" cy="168" r="3.4" fill="#fff" opacity=".9"/>
  <path d="M125 186l15-13 10 8 9-11 19 16z" fill="#fff" opacity=".85"/>
  <path d="M126 186h64" stroke="#fff" opacity=".35"/>
  <rect x="198" y="158" width="98" height="16" rx="8" fill="#e2f8f1"/>
  <path d="M205 166l3 3 5-6" fill="none" stroke="#0ea47f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="216" y="169.5" class="t" font-size="7.5" font-weight="700" fill="#0b8a6f">Alt text included</text>
  <rect x="198" y="178" width="76" height="7" rx="3.5" fill="#dce8f9"/>
  <rect x="198" y="188" width="52" height="6" rx="3" fill="#e8effa"/>
  <rect x="122" y="206" width="54" height="0" fill="none"/>

  <g filter="url(#chip)">
    <rect x="12" y="26" width="104" height="40" rx="20" fill="#fff"/>
    <circle cx="34" cy="46" r="13" fill="#e5efff"/>
    <rect x="27" y="40" width="14" height="11" rx="2" fill="none" stroke="#2f6fe4" stroke-width="1.5"/>
    <path d="M30 50l4-4 3 2.5 3-4" fill="none" stroke="#2f6fe4" stroke-width="1.2" stroke-linecap="round"/>
    <text x="54" y="43.5" class="t" font-size="9.5" font-weight="700" fill="#0a1f44">Alt text</text>
    <text x="54" y="55" class="t" font-size="7.5" fill="#7b8dab">Described</text>
  </g>

  <g filter="url(#chip)">
    <rect x="326" y="22" width="104" height="40" rx="20" fill="#fff"/>
    <circle cx="348" cy="42" r="13" fill="#e4f8f1"/>
    <circle cx="348" cy="42" r="6.5" fill="none" stroke="#0ea47f" stroke-width="1.5"/>
    <path d="M348 35.5a6.5 6.5 0 0 1 0 13z" fill="#0ea47f"/>
    <text x="368" y="39.5" class="t" font-size="9.5" font-weight="700" fill="#0a1f44">Contrast</text>
    <text x="368" y="51" class="t" font-size="7.5" fill="#7b8dab">7.1 : 1</text>
  </g>

  <g filter="url(#chip)">
    <rect x="22" y="196" width="108" height="40" rx="20" fill="#fff"/>
    <circle cx="44" cy="216" r="13" fill="#f0ebff"/>
    <rect x="34" y="212" width="20" height="9" rx="2" fill="none" stroke="#7048e8" stroke-width="1.4"/>
    <path d="M38 214v5M43 214v5M48 214v5" stroke="#7048e8" stroke-width="1.2" stroke-linecap="round"/>
    <text x="64" y="213.5" class="t" font-size="9.5" font-weight="700" fill="#0a1f44">Keyboard</text>
    <text x="64" y="225" class="t" font-size="7.5" fill="#7b8dab">Fully usable</text>
  </g>

  <g filter="url(#chip)">
    <rect x="314" y="192" width="110" height="40" rx="20" fill="#fff"/>
    <circle cx="336" cy="212" r="13" fill="#fff4db"/>
    <rect x="327" y="206" width="18" height="12" rx="3" fill="none" stroke="#e79612" stroke-width="1.4"/>
    <text x="336" y="214.5" class="t" font-size="6.5" font-weight="700" fill="#e79612" text-anchor="middle">CC</text>
    <text x="356" y="209.5" class="t" font-size="9.5" font-weight="700" fill="#0a1f44">Captions</text>
    <text x="356" y="221" class="t" font-size="7.5" fill="#7b8dab">Always on</text>
  </g>
</svg>
