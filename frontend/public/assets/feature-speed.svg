<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
  <title id="title">Faster, easier compliance</title>
  <desc id="desc">A stopwatch and a workflow card showing scan, fix, and verify steps moving quickly in one flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9eb"/>
      <stop offset="1" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb53d"/>
      <stop offset="1" stop-color="#ef8a00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75a9ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65dfc0"/>
      <stop offset="1" stop-color="#0ea47f"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#f0d9a6" opacity=".7"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#6b460b" flood-opacity=".18"/>
    </filter>
    <filter id="chip" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6b460b" flood-opacity=".14"/>
    </filter>
  </defs>
  <style>.t{font-family:'Segoe UI',Arial,sans-serif}</style>

  <rect x="0" y="0" width="440" height="260" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="440" height="260" rx="22" fill="url(#dots)" opacity=".7"/>
  <circle cx="30" cy="230" r="70" fill="#ffefc9" opacity=".8"/>
  <circle cx="420" cy="24" r="62" fill="#ffefc9" opacity=".7"/>

  <g stroke="#f4b64a" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M26 96h28"/>
    <path d="M14 118h34"/>
    <path d="M30 140h22"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="156" cy="140" r="66" fill="url(#orange)"/>
  </g>
  <circle cx="156" cy="140" r="53" fill="#fff"/>
  <circle cx="156" cy="140" r="53" fill="none" stroke="#ffe1a7" stroke-width="2"/>
  <g stroke="#f0b75a" stroke-width="2.2" stroke-linecap="round">
    <path d="M156 94v7"/>
    <path d="M156 179v7"/>
    <path d="M110 140h7"/>
    <path d="M195 140h7"/>
  </g>
  <g stroke="#f6d49a" stroke-width="1.4" stroke-linecap="round">
    <path d="M156 100v4"/>
    <path d="M156 176v4"/>
    <path d="M116 140h4"/>
    <path d="M192 140h4"/>
    <path d="M128 112l3 3"/>
    <path d="M184 168l-3-3"/>
    <path d="M128 168l3-3"/>
    <path d="M184 112l-3 3"/>
  </g>
  <path d="M156 140l30-16" stroke="#e88900" stroke-width="5" stroke-linecap="round"/>
  <circle cx="156" cy="140" r="7" fill="#e88900"/>
  <circle cx="156" cy="140" r="3" fill="#fff"/>
  <rect x="147" y="62" width="18" height="13" rx="4" fill="#de7d00"/>
  <rect x="150" y="59" width="12" height="6" rx="3" fill="#f8a21a"/>
  <path d="M140 73l-6-6h44l-6 6z" fill="#ef8a00"/>

  <g filter="url(#chip)">
    <rect x="244" y="54" width="170" height="152" rx="16" fill="#fff"/>
    <text x="260" y="76" class="t" font-size="9.8" font-weight="700" fill="#0a1f44">One smooth workflow</text>
    <text x="260" y="90" class="t" font-size="7.4" fill="#7b8dab">Scan, fix, and verify in one place.</text>

    <g>
      <rect x="260" y="104" width="138" height="22" rx="6" fill="#f8fbff"/>
      <text x="268" y="118.5" class="t" font-size="7.4" font-weight="600" fill="#40597d">Scan</text>
      <rect x="306" y="111" width="66" height="8" rx="4" fill="#e8effa"/>
      <rect x="306" y="111" width="56" height="8" rx="4" fill="url(#blue)"/>
      <circle cx="388" cy="115" r="5" fill="#e7f0ff"/>
      <path d="M386 115l1.6 1.6 3-3.2" fill="none" stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="260" y="132" width="138" height="22" rx="6" fill="#fbf9ff"/>
      <text x="268" y="146.5" class="t" font-size="7.4" font-weight="600" fill="#40597d">Fix</text>
      <rect x="306" y="139" width="66" height="8" rx="4" fill="#ece7ff"/>
      <rect x="306" y="139" width="60" height="8" rx="4" fill="#8b6ff0"/>
      <circle cx="388" cy="143" r="5" fill="#f0ebff"/>
      <path d="M386 143l1.6 1.6 3-3.2" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="260" y="160" width="138" height="22" rx="6" fill="#f6fcf9"/>
      <text x="268" y="174.5" class="t" font-size="7.4" font-weight="600" fill="#40597d">Verify</text>
      <rect x="306" y="167" width="66" height="8" rx="4" fill="#e4f6f0"/>
      <rect x="306" y="167" width="66" height="8" rx="4" fill="url(#green)"/>
      <circle cx="388" cy="171" r="5" fill="#e7f9f2"/>
      <path d="M386 171l1.6 1.6 3-3.2" fill="none" stroke="#0ea47f" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="260" y="189" width="138" height="1" fill="#eef2f9"/>
    <path d="M260 201l2.2 4.8 4.8 2.2-4.8 2.2-2.2 4.8-2.2-4.8-4.8-2.2 4.8-2.2z" fill="#f5b53d"/>
    <text x="272" y="204" class="t" font-size="7.2" font-weight="600" fill="#8a6a2a">No more handoffs</text>
  </g>

  <g filter="url(#chip)">
    <rect x="8" y="24" width="112" height="38" rx="19" fill="#fff"/>
    <path d="M29 35l-10 18h8l-2 12 11-17h-8z" fill="url(#amber)"/>
    <text x="48" y="46" class="t" font-size="9.2" font-weight="700" fill="#0a1f44">Save time</text>
    <text x="48" y="57" class="t" font-size="7.2" fill="#7b8dab">Less manual work</text>
  </g>

  <g filter="url(#chip)">
    <rect x="292" y="218" width="140" height="36" rx="18" fill="#fff"/>
    <circle cx="312" cy="236" r="11" fill="#fff2d5"/>
    <path d="M307 236h10M313 232l4 4-4 4" fill="none" stroke="#e59200" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="240" class="t" font-size="9" font-weight="700" fill="#0a1f44">One workflow</text>
  </g>
</svg>
