<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
  <title id="title">Verified changes</title>
  <desc id="desc">A shield with a check mark and a verification card confirming contrast, keyboard, and ARIA checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfbf7"/>
      <stop offset="1" stop-color="#f8fffd"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe0be"/>
      <stop offset="1" stop-color="#0c9c7b"/>
    </linearGradient>
    <linearGradient id="greenDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18b393"/>
      <stop offset="1" stop-color="#087d65"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#c2e9de" opacity=".75"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0c4a3d" flood-opacity=".18"/>
    </filter>
    <filter id="chip" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0c4a3d" flood-opacity=".14"/>
    </filter>
  </defs>
  <style>.t{font-family:'Segoe UI',Arial,sans-serif}</style>

  <rect x="0" y="0" width="440" height="260" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="440" height="260" rx="22" fill="url(#dots)" opacity=".7"/>
  <circle cx="28" cy="28" r="70" fill="#d6f5ec" opacity=".8"/>
  <circle cx="420" cy="240" r="66" fill="#dcf7ef" opacity=".8"/>

  <g filter="url(#shadow)">
    <path d="M148 40l86 29v57c0 48-34 79-86 96-52-17-86-48-86-96V69z" fill="url(#green)"/>
  </g>
  <path d="M148 53l72 24v48c0 40-28 66-72 81-44-15-72-41-72-81V77z" fill="none" stroke="#fff" stroke-width="2" opacity=".42"/>
  <path d="M110 128l26 26 52-58" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="208" cy="65" r="20" fill="#fff" opacity=".95"/>
  <path d="M200 65l6 6 11-13" fill="none" stroke="#0c9c7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#chip)">
    <rect x="252" y="52" width="160" height="158" rx="16" fill="#fff"/>
    <text x="268" y="74" class="t" font-size="10" font-weight="700" fill="#0a1f44">Verification</text>
    <rect x="356" y="63" width="40" height="16" rx="8" fill="#e9f9f3"/>
    <text x="376" y="74" class="t" font-size="6.8" font-weight="700" fill="#0b8a6f" text-anchor="middle">LIVE</text>

    <circle cx="332" cy="111" r="28" fill="none" stroke="#e4f3ee" stroke-width="6"/>
    <circle cx="332" cy="111" r="28" fill="none" stroke="url(#greenDeep)" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="175.9 175.9" transform="rotate(-90 332 111)"/>
    <path d="M319 111l8 8 16-18" fill="none" stroke="#0b8a6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="332" y="151" class="t" font-size="7.2" font-weight="600" fill="#6f88a4" text-anchor="middle">All checks passed</text>

    <g>
      <rect x="268" y="158" width="128" height="20" rx="6" fill="#f6fbf9"/>
      <circle cx="278" cy="168" r="4.2" fill="#0ea47f"/>
      <path d="M276 168l1.5 1.5 3-3.2" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="288" y="171" class="t" font-size="7.4" fill="#40597d">Contrast</text>
      <text x="385" y="171" class="t" font-size="7" font-weight="700" fill="#0b8a6f" text-anchor="end">Pass</text>

      <rect x="268" y="182" width="128" height="20" rx="6" fill="#f6fbf9"/>
      <circle cx="278" cy="192" r="4.2" fill="#0ea47f"/>
      <path d="M276 192l1.5 1.5 3-3.2" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="288" y="195" class="t" font-size="7.4" fill="#40597d">Keyboard</text>
      <text x="385" y="195" class="t" font-size="7" font-weight="700" fill="#0b8a6f" text-anchor="end">Pass</text>
    </g>
  </g>

  <g filter="url(#chip)">
    <rect x="6" y="30" width="124" height="40" rx="20" fill="#fff"/>
    <circle cx="28" cy="50" r="13" fill="#e9f9f3"/>
    <path d="M22 50a6 6 0 0 1 10.4-4.1M34 50a6 6 0 0 1-10.4 4.1" fill="none" stroke="#0e9d7d" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M34 42v4h-4M22 58v-4h4" fill="none" stroke="#0e9d7d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="47" class="t" font-size="9.2" font-weight="700" fill="#0a1f44">Auto re-check</text>
    <text x="48" y="59" class="t" font-size="7.3" fill="#7b8dab">Every change</text>
  </g>

  <g filter="url(#chip)">
    <rect x="292" y="218" width="140" height="36" rx="18" fill="#fff"/>
    <circle cx="312" cy="236" r="11" fill="#0ea47f"/>
    <path d="M307 236l3.5 3.5 6.5-7.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="240" class="t" font-size="9" font-weight="700" fill="#0a1f44">WCAG 2.2 AA</text>
  </g>

  <path d="M236 28l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" fill="#5fd5b7"/>
  <path d="M62 208l1.4 3.8 3.8 1.4-3.8 1.4-1.4 3.8-1.4-3.8-3.8-1.4 3.8-1.4z" fill="#7adfc5"/>
</svg>
