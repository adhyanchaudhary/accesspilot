<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">AccessPilot accessibility audit dashboard</title>
  <desc id="desc">A product preview showing an accessibility score of 92, prioritized issues, an AI-suggested code fix, and resolved issues over time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset=".55" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#ecf4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9bff"/>
      <stop offset="1" stop-color="#2463ea"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d3fe0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee0c0"/>
      <stop offset="1" stop-color="#0ea47f"/>
    </linearGradient>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8cff"/>
      <stop offset="1" stop-color="#0ea47f"/>
    </linearGradient>
    <linearGradient id="aiPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ff"/>
      <stop offset="1" stop-color="#fbfaff"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#c7dbfb" opacity=".65"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#173b72" flood-opacity=".16"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#173b72" flood-opacity=".15"/>
    </filter>
    <filter id="tiny" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#173b72" flood-opacity=".13"/>
    </filter>
    <clipPath id="browserClip">
      <rect x="80" y="62" width="560" height="490" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .t{font-family:'Segoe UI',Arial,sans-serif}
    .m{font-family:Consolas,'Courier New',monospace}
  </style>

  <rect x="14" y="14" width="732" height="592" rx="46" fill="url(#bg)"/>
  <rect x="14" y="14" width="732" height="592" rx="46" fill="url(#dots)" opacity=".75"/>
  <circle cx="700" cy="92" r="92" fill="#dcecff" opacity=".75"/>
  <circle cx="54" cy="566" r="64" fill="#e3eeff" opacity=".8"/>

  <g filter="url(#shadow)">
    <rect x="80" y="62" width="560" height="490" rx="22" fill="#fff"/>
  </g>
  <g clip-path="url(#browserClip)">
    <rect x="80" y="62" width="560" height="44" fill="#f2f7ff"/>
    <path d="M80 106h560" stroke="#e4edf9"/>
    <circle cx="103" cy="84" r="4" fill="#ff7f7f"/>
    <circle cx="117" cy="84" r="4" fill="#ffcd5c"/>
    <circle cx="131" cy="84" r="4" fill="#42d0a4"/>
    <rect x="172" y="72" width="252" height="23" rx="11.5" fill="#e8f0fb"/>
    <path d="M187 83.5a2.6 2.6 0 0 1 2.6-2.6h1.4a2.6 2.6 0 0 1 2.6 2.6v3.2a2.6 2.6 0 0 1-2.6 2.6h-1.4a2.6 2.6 0 0 1-2.6-2.6z" fill="none" stroke="#6d85a9" stroke-width="1.2"/>
    <path d="M190 83.5v-1.2a1.8 1.8 0 0 1 3.6 0v1.2" fill="none" stroke="#6d85a9" stroke-width="1.2"/>
    <text x="201" y="87.5" class="t" font-size="10" fill="#63799c">app.accesspilot.com/audit</text>
    <circle cx="605" cy="84" r="10" fill="#dceeff"/>
    <text x="605" y="87.5" class="t" font-size="8.5" font-weight="700" fill="#2563eb" text-anchor="middle">AP</text>
  </g>

  <text x="104" y="142" class="t" font-size="20" font-weight="700" fill="#0a1f44">Audit overview</text>
  <text x="104" y="162" class="t" font-size="10.5" fill="#7588a7">example.com · Last scan 2 min ago</text>

  <g>
    <circle cx="574" cy="160" r="37" fill="none" stroke="#e7effb" stroke-width="8"/>
    <circle cx="574" cy="160" r="37" fill="none" stroke="url(#score)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="214 232.5" transform="rotate(-90 574 160)"/>
    <text x="574" y="164" class="t" font-size="19" font-weight="800" fill="#0a1f44" text-anchor="middle">92</text>
    <text x="574" y="178" class="t" font-size="7.5" font-weight="600" fill="#7b8dab" text-anchor="middle" letter-spacing=".6">SCORE</text>
  </g>

  <g>
    <rect x="104" y="198" width="324" height="210" rx="16" fill="#f8fbff" stroke="#e3edfb"/>
    <text x="120" y="222" class="t" font-size="12.5" font-weight="700" fill="#0a1f44">Prioritized issues</text>
    <rect x="340" y="208" width="72" height="21" rx="10.5" fill="#fff1f0"/>
    <circle cx="352" cy="218.5" r="3" fill="#f05a5a"/>
    <text x="360" y="222" class="t" font-size="9" font-weight="700" fill="#d64545">12 open</text>

    <rect x="116" y="236" width="300" height="48" rx="12" fill="#fff" stroke="#e7eef9"/>
    <circle cx="137" cy="260" r="13" fill="#fff1e4"/>
    <path d="M137 252.5l6.5 11.5h-13z" fill="none" stroke="#e99b2f" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M137 256.5v3.4" stroke="#e99b2f" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="137" cy="262.6" r=".9" fill="#e99b2f"/>
    <text x="158" y="256" class="t" font-size="11" font-weight="600" fill="#18325c">Low contrast text</text>
    <text x="158" y="271" class="t" font-size="9" fill="#7b8dab">4.2:1 ratio · Serious</text>
    <rect x="356" y="247" width="46" height="18" rx="9" fill="#ffede3"/>
    <text x="379" y="259.5" class="t" font-size="8.5" font-weight="700" fill="#c46612" text-anchor="middle">High</text>

    <rect x="116" y="292" width="300" height="48" rx="12" fill="#fff" stroke="#e7eef9"/>
    <circle cx="137" cy="316" r="13" fill="#eef1ff"/>
    <rect x="131" y="309" width="12" height="10" rx="2" fill="none" stroke="#6d63d9" stroke-width="1.5"/>
    <path d="M134 317l3.6-3.6 2.2 2.2" fill="none" stroke="#6d63d9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="141" cy="311.5" r="1.2" fill="#6d63d9"/>
    <text x="158" y="312" class="t" font-size="11" font-weight="600" fill="#18325c">Missing image alt</text>
    <text x="158" y="327" class="t" font-size="9" fill="#7b8dab">3 instances · Moderate</text>
    <rect x="356" y="303" width="46" height="18" rx="9" fill="#eeeaff"/>
    <text x="379" y="315.5" class="t" font-size="8.5" font-weight="700" fill="#6248c7" text-anchor="middle">Med</text>

    <rect x="116" y="348" width="300" height="48" rx="12" fill="#fff" stroke="#e7eef9"/>
    <circle cx="137" cy="372" r="13" fill="#e9f8f4"/>
    <path d="M131 377c1.5-5.5 3.5-8 6-8s4.5 2.5 6 8" fill="none" stroke="#139b7d" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="137" cy="364.5" r="2.2" fill="none" stroke="#139b7d" stroke-width="1.5"/>
    <text x="158" y="368" class="t" font-size="11" font-weight="600" fill="#18325c">Focus order</text>
    <text x="158" y="383" class="t" font-size="9" fill="#7b8dab">Keyboard trap · Serious</text>
    <rect x="356" y="359" width="46" height="18" rx="9" fill="#e5f8f2"/>
    <text x="379" y="371.5" class="t" font-size="8.5" font-weight="700" fill="#0c866d" text-anchor="middle">Fixed</text>
  </g>

  <g>
    <rect x="444" y="198" width="168" height="210" rx="16" fill="url(#aiPanel)" stroke="#e8ddfb"/>
    <path d="M460 211l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6z" fill="#7c4fe0"/>
    <text x="470" y="220" class="t" font-size="10.5" font-weight="700" fill="#5b3cc4">AI fix suggestion</text>

    <rect x="456" y="232" width="144" height="102" rx="10" fill="#151a2d"/>
    <text x="466" y="250" class="m" font-size="8" fill="#7ea6ff">&lt;button</text>
    <text x="476" y="263" class="m" font-size="8" fill="#7ee0c2">class="cta"</text>
    <text x="476" y="276" class="m" font-size="8" fill="#f7c96b">aria-label=</text>
    <text x="514" y="289" class="m" font-size="8" fill="#b9a7ff">"Start scan"&gt;</text>
    <text x="476" y="302" class="m" font-size="8" fill="#e7edff">Start scan</text>
    <text x="466" y="315" class="m" font-size="8" fill="#7ea6ff">&lt;/button&gt;</text>
    <rect x="456" y="321" width="144" height="13" rx="3" fill="#1d2a44"/>
    <circle cx="463" cy="327.5" r="2.2" fill="#3ddc97"/>
    <text x="470" y="330.5" class="m" font-size="7.5" fill="#67e4ae">Contrast 7.1:1</text>

    <rect x="456" y="345" width="144" height="32" rx="16" fill="url(#violet)"/>
    <path d="M470 356l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#fff" opacity=".85"/>
    <text x="537" y="365.5" class="t" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Apply fix</text>
    <text x="528" y="386" class="t" font-size="8" fill="#8a76b8" text-anchor="middle">Human approval required</text>
  </g>

  <g>
    <rect x="104" y="420" width="508" height="104" rx="16" fill="#fff" stroke="#e3edfb"/>
    <text x="120" y="444" class="t" font-size="11" font-weight="600" fill="#18325c">Impact this week</text>
    <text x="120" y="464" class="t" font-size="15" font-weight="800" fill="#0a1f44">38 of 47 issues resolved</text>
    <rect x="120" y="474" width="70" height="19" rx="9.5" fill="#e9f9f3"/>
    <path d="M130 486l3.5-3.5 3 3 3.5-4.5" fill="none" stroke="#0e9d7d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="487.5" class="t" font-size="8.5" font-weight="700" fill="#0b8a6f">+18% this week</text>

    <path d="M366 504h228" stroke="#edf2fa"/>
    <rect x="368" y="484" width="18" height="20" rx="5" fill="#d8e7ff"/>
    <rect x="398" y="472" width="18" height="32" rx="5" fill="#bdd5ff"/>
    <rect x="428" y="478" width="18" height="26" rx="5" fill="#c9dcff"/>
    <rect x="458" y="460" width="18" height="44" rx="5" fill="#91b7ff"/>
    <rect x="488" y="452" width="18" height="52" rx="5" fill="#5f97ff"/>
    <rect x="518" y="444" width="18" height="60" rx="5" fill="url(#blue)"/>
    <rect x="548" y="466" width="18" height="38" rx="5" fill="#a9d9cd"/>
    <rect x="578" y="436" width="18" height="68" rx="5" fill="url(#green)"/>
  </g>

  <g filter="url(#tiny)">
    <rect x="536" y="28" width="200" height="48" rx="24" fill="#fff"/>
    <circle cx="562" cy="52" r="14" fill="#e4f8f1"/>
    <path d="M555 52l5 5 9-10" fill="none" stroke="#0e9d7d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="584" y="50" class="t" font-size="11.5" font-weight="700" fill="#0a1f44">WCAG 2.2 AA</text>
    <text x="584" y="64" class="t" font-size="8.8" fill="#7b8dab">Aligned checks</text>
  </g>

  <g filter="url(#tiny)">
    <rect x="6" y="424" width="196" height="82" rx="18" fill="#fff"/>
    <circle cx="38" cy="458" r="17" fill="url(#green)"/>
    <path d="M30 458l5.5 5.5L46 452" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="450" class="t" font-size="11.5" font-weight="700" fill="#0a1f44">Fix verified</text>
    <text x="64" y="465" class="t" font-size="9" fill="#7b8dab">Contrast now 7.1:1</text>
    <rect x="64" y="474" width="112" height="6" rx="3" fill="#e9f4f0"/>
    <rect x="64" y="474" width="112" height="6" rx="3" fill="url(#green)"/>
  </g>

  <g filter="url(#tiny)">
    <rect x="620" y="520" width="126" height="46" rx="23" fill="#fff"/>
    <path d="M642 533l1.7 4.6 4.6 1.7-4.6 1.7-1.7 4.6-1.7-4.6-4.6-1.7 4.6-1.7z" fill="url(#violet)"/>
    <text x="654" y="548" class="t" font-size="10.5" font-weight="700" fill="#0a1f44">AI assist</text>
  </g>
</svg>
